<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepção - CDSS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text"><strong>CDSS</strong></span>
        </div>
        <nav class="header-nav">
            <a href="recepcao.html" class="nav-item active">Painel da Recepção</a>
        </nav>
        <div class="header-user">
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">ID Clínica: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">🧑‍💼</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="section-header">
                <h2>Ficha de Admissão de Paciente</h2>
                <span class="badge-consultas" style="background: #e2e8f0; color: #475569;">Acesso: Recepção</span>
            </div>

            <div class="clinical-section">
                <div class="form-grid-2">
                    <div>
                        <label for="recNome">Nome Completo do Paciente:</label>
                        <input type="text" id="recNome" placeholder="Ex: Maria Oliveira">
                    </div>
                    <div>
                        <label for="recNascimento">Data de Nascimento:</label>
                        <input type="date" id="recNascimento">
                    </div>
                    <div>
                        <label for="recDocumento">CPF / Documento:</label>
                        <div class="search-wrapper" style="margin-bottom: 12px;">
                            <input type="text" id="recDocumento" placeholder="000.000.000-00">
                            <button id="btnBuscarPaciente" class="btn-secondary" type="button" title="Buscar Cadastro Automático">🔍 Buscar</button>
                        </div>
                    </div>
                    <div>
                        <label for="recContato">Telefone / Contato:</label>
                        <input type="text" id="recContato" placeholder="(11) 99999-9999">
                    </div>
                    <div>
                        <label for="sexoPaciente">Sexo:</label>
                        <select id="sexoPaciente" required>
                            <option value="">Selecione...</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                        </select>
                    </div>
                    <div>
                        <label for="recMedicoSelecionado" style="color: var(--primary);">Médico Responsável (Nome ou CRM):</label>
                        <input type="text" id="recMedicoSelecionado" list="listaMedicosDatalist" placeholder="Digite para buscar...">
                        <datalist id="listaMedicosDatalist"></datalist>
                    </div>
                </div>

                <div>
                    <label for="recMotivo">Motivo da Consulta (Triagem Básica):</label>
                    <textarea id="recMotivo" class="small-text" placeholder="Ex: Paciente vem para retorno cardiológico..."></textarea>
                </div>

                <div style="text-align: right;">
                    <button id="btnSalvarAdmissao" class="action-btn">Salvar e Enviar para o Médico</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div class="form-grid-2" style="margin-bottom: 20px;">
                <div class="col-span-2">
                    <label for="perfilEmail">E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled>
                </div>
                
                <div class="col-span-2">
                    <label for="perfilNome">Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva">
                </div>
                
                <div>
                    <label for="perfilNascimento">Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento">
                </div>
                
                <div>
                    <label for="perfilCpf">CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00">
                </div>
                
                <div class="col-span-2">
                    <label for="perfilCrmPessoal">CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP">
                    <small style="color: var(--text-muted); font-size: 12px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="recepcao.js"></script>
</body>
</html>
