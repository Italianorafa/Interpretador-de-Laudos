<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepção - Softplan CDSS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text">Softplan<strong>CDSS</strong></span>
        </div>
        <nav class="header-nav">
            <a href="recepcao.html" class="nav-item active" style="text-decoration: none;">Painel da Recepção</a>
        </nav>
        <div class="header-user">
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">ID Clínica: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">🧑‍💼</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="section-header">
                <h2>Ficha de Admissão de Paciente</h2>
                <span class="badge-consultas" style="background: #e2e8f0; color: #475569;">Acesso: Recepção</span>
            </div>

            <div class="clinical-section">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Nome Completo do Paciente:</label>
                        <input type="text" id="recNome" placeholder="Ex: Maria Oliveira">
                    </div>
                    <div>
                        <label>Data de Nascimento:</label>
                        <input type="date" id="recNascimento">
                    </div>
                    <div>
                        <label>CPF / Documento:</label>
                        <input type="text" id="recDocumento" placeholder="000.000.000-00">
                    </div>
                    <div>
                        <label>Telefone / Contato:</label>
                        <input type="text" id="recContato" placeholder="(11) 99999-9999">
                    </div>
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);">
                        <label style="color: var(--primary);"><strong>Médico Responsável pelo Atendimento (Busque por Nome ou CRM):</strong></label>
                        <input type="text" id="recMedicoSelecionado" list="listaMedicosDatalist" placeholder="Digite para buscar..." style="width: 100%; max-width: 500px;">
                        
                        <!-- O JavaScript vai injetar os médicos aqui dentro -->
                        <datalist id="listaMedicosDatalist"></datalist>
                    </div>
                </div>

                <label style="margin-top: 15px; display: block;">Motivo da Consulta (Triagem Básica):</label>
                <textarea id="recMotivo" class="small-text" placeholder="Ex: Paciente vem para retorno cardiológico..."></textarea>

                <div style="text-align: right; margin-top: 20px;">
                    <button id="btnSalvarAdmissao" class="action-btn">Salvar e Enviar para o Médico</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div style="grid-column: span 2;">
                    <label>E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled style="background: #f1f5f9; cursor: not-allowed; width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva" style="width: 100%;">
                </div>
                
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento" style="width: 100%;">
                </div>
                
                <div>
                    <label>CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00" style="width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP" style="width: 100%;">
                    <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="recepcao.js"></script>
</body>
</html>
