<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CDSS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <div class="login-box">
        <h2 id="loginTitle">⚕️ CDSS</h2>
        
        <div class="clinical-section" style="margin-bottom: 15px;">
            <input type="email" id="authEmail" placeholder="E-mail profissional">
            <input type="password" id="authSenha" placeholder="Palavra-passe (Mín. 6 caracteres)">
            <input type="text" id="authCrm" class="hidden" placeholder="Seu CRM (Ex: 12345-SP)">
        </div>
        
        <button id="btnEntrar" class="action-btn">Acessar Sistema</button>
        <p id="toggleAuthMode" class="auth-link">Não tem conta? <strong>Registe-se aqui</strong></p>
        
        <div id="authLoading" class="hidden" style="margin-top: 15px;">
            <p class="loading-text">A processar...</p>
        </div>

        <!-- 🧪 BLOCO DE ACESSOS DE TESTE PARA O AVALIADOR (CLIQUE RÁPIDO) -->
        <div style="margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); text-align: left; font-size: 13px; color: var(--text-muted);">
            <strong style="color: var(--text-main); display: block; margin-bottom: 4px;">🧪 Contas de Teste para Avaliação:</strong>
            <small style="display: block; margin-bottom: 10px; color: var(--text-muted);">Clique em um perfil abaixo para preencher automaticamente:</small>
            <div class="demo-accounts-list">
                <button type="button" class="demo-account-btn" data-email="medico@teste.com" data-senha="123456">
                    <span>👨‍⚕️ <strong>Médico / Admin</strong></span>
                    <code>medico@teste.com</code>
                </button>
                <button type="button" class="demo-account-btn" data-email="recepcao@teste.com" data-senha="123456">
                    <span>👩‍💼 <strong>Recepção</strong></span>
                    <code>recepcao@teste.com</code>
                </button>
                <button type="button" class="demo-account-btn" data-email="adm@teste.com" data-senha="123456">
                    <span>🏢 <strong>Administração</strong></span>
                    <code>adm@teste.com</code>
                </button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
