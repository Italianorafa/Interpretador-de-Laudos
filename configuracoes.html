<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Softplan CDSS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text">Softplan<strong>CDSS</strong></span>
        </div>
        
        <nav class="header-nav">
            <!-- O 'active' mudará dependendo da página em que está -->
            <a href="fila.html" class="nav-item" style="text-decoration: none;">Fila de Espera</a>
            <a href="consulta.html" class="nav-item" style="text-decoration: none;">Nova Consulta</a>
            <a href="pacientes.html" class="nav-item" style="text-decoration: none;">Meus Pacientes</a>
        </nav>

        <div class="header-user">
            <!-- Ícone de Engrenagem Adicionado Aqui -->
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">CRM: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">👨‍⚕️</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="section-header">
                <h2>Gestão de Equipe e Acessos</h2>
                <span class="badge-consultas" style="background: var(--primary); color: white;">Acesso: Administrador</span>
            </div>

            <!-- Formulário de Criação de Acessos -->
            <div class="clinical-section" style="margin-bottom: 25px;">
                <h3>Criar Novo Acesso (Login)</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                    <div>
                        <label>E-mail de Acesso:</label>
                        <input type="email" id="emailAcesso" placeholder="exemplo@clinica.com">
                    </div>
                    <div>
                        <label>Senha Temporária:</label>
                        <input type="text" id="senhaAcesso" placeholder="Ex: Mudar@123">
                    </div>
                    <div>
                        <label>Nome do Profissional:</label>
                        <input type="text" id="nomeMembro" placeholder="Ex: Ana Souza">
                    </div>
                    <div>
                        <label>Cargo / Função:</label>
                        <select id="cargoMembro" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px;">
                            <option value="Médico Plantonista">Médico Plantonista</option>
                            <option value="Enfermeiro(a) Triagem">Enfermeiro(a) Triagem</option>
                            <option value="Atendente / Recepção">Atendente / Recepção</option>
                        </select>
                    </div>
                    <div style="grid-column: span 2;">
                        <label>Permissão do Sistema:</label>
                        <select id="acessoMembro" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px;">
                            <option value="Total">Médico (Acesso Total Clínico e Administrativo)</option>
                            <option value="Administrativo">Administrativo (Gestão de Equipe e Recepção)</option>
                            <option value="Agendamento">Recepção (Apenas Cadastro de Pacientes)</option>
                            <option value="Leitura">Leitura (Apenas visualização de histórico)</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 15px; text-align: right;">
                    <button id="btnAdicionarMembro" class="action-btn" style="width: auto; padding: 10px 25px;">+ Criar Login</button>
                </div>
            </div>

            <!-- Tabela de Equipa -->
            <div class="table-container">
                <table class="saas-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Nível de Acesso</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaEquipe">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div style="grid-column: span 2;">
                    <label>E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled style="background: #f1f5f9; cursor: not-allowed; width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva" style="width: 100%;">
                </div>
                
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento" style="width: 100%;">
                </div>
                
                <div>
                    <label>CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00" style="width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP" style="width: 100%;">
                    <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="configuracoes.js"></script>
</body>
</html>
