<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - CDSS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text"><strong>CDSS</strong></span>
        </div>
        
        <nav class="header-nav">
            <a href="fila.html" class="nav-item">Fila de Espera</a>
            <a href="consulta.html" class="nav-item">Nova Consulta</a>
            <a href="pacientes.html" class="nav-item">Meus Pacientes</a>
        </nav>

        <div class="header-user">
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">CRM: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">👨‍⚕️</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="section-header">
                <h2>Gestão de Equipe e Acessos</h2>
                <span class="badge-consultas" style="background: var(--primary); color: white;">Acesso: Administrador</span>
            </div>

            <!-- Formulário de Criação de Acessos -->
            <div class="clinical-section" style="margin-bottom: 25px;">
                <h3>Criar Novo Acesso (Login)</h3>
                <div class="form-grid-2">
                    <div>
                        <label for="emailAcesso">E-mail de Acesso:</label>
                        <input type="email" id="emailAcesso" placeholder="exemplo@clinica.com">
                    </div>
                    <div>
                        <label for="senhaAcesso">Senha Temporária:</label>
                        <input type="text" id="senhaAcesso" placeholder="Ex: Mudar@123">
                    </div>
                    <div>
                        <label for="nomeMembro">Nome do Profissional:</label>
                        <input type="text" id="nomeMembro" placeholder="Ex: Ana Souza">
                    </div>
                    <div>
                        <label for="cargoMembro">Cargo / Função:</label>
                        <select id="cargoMembro">
                            <option value="Médico Plantonista">Médico Plantonista</option>
                            <option value="Enfermeiro(a) Triagem">Enfermeiro(a) Triagem</option>
                            <option value="Atendente / Recepção">Atendente / Recepção</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label for="acessoMembro">Permissão do Sistema:</label>
                        <select id="acessoMembro">
                            <option value="Total">Médico (Acesso Total Clínico e Administrativo)</option>
                            <option value="Administrativo">Administrativo (Gestão de Equipe e Recepção)</option>
                            <option value="Agendamento">Recepção (Apenas Cadastro de Pacientes)</option>
                            <option value="Leitura">Leitura (Apenas visualização de histórico)</option>
                        </select>
                    </div>
                </div>
                <div style="text-align: right;">
                    <button id="btnAdicionarMembro" class="action-btn" style="width: auto; padding: 12px 28px;">+ Criar Login</button>
                </div>
            </div>

            <!-- Tabela de Equipa -->
            <div class="table-container">
                <table class="saas-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Nível de Acesso</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaEquipe">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div class="form-grid-2" style="margin-bottom: 20px;">
                <div class="col-span-2">
                    <label for="perfilEmail">E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled>
                </div>
                
                <div class="col-span-2">
                    <label for="perfilNome">Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva">
                </div>
                
                <div>
                    <label for="perfilNascimento">Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento">
                </div>
                
                <div>
                    <label for="perfilCpf">CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00">
                </div>
                
                <div class="col-span-2">
                    <label for="perfilCrmPessoal">CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP">
                    <small style="color: var(--text-muted); font-size: 12px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/configuracoes.js"></script>
</body>
</html>
