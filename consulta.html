<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Consulta - Softplan CDSS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text">Softplan<strong>CDSS</strong></span>
        </div>
        
        <nav class="header-nav">
            <a href="fila.html" class="nav-item" style="text-decoration: none;">Fila de Espera</a>
            <a href="consulta.html" class="nav-item" style="text-decoration: none;">Nova Consulta</a>
            <a href="pacientes.html" class="nav-item" style="text-decoration: none;">Meus Pacientes</a>
        </nav>

        <div class="header-user">
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">CRM: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">👨‍⚕️</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="clinical-section">
                
                <!-- Grelha de Identificação do Paciente (Nome, Documento, Sexo, Nascimento e Idade) -->
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                    <div style="grid-column: span 2;">
                        <label for="nomePaciente" style="display:block; margin-bottom:5px;">Nome do Paciente:</label>
                        <input type="text" id="nomePaciente" placeholder="Ex: João da Silva" style="width: 100%;">
                    </div>
                    <div>
                        <label for="documentoPaciente" style="display:block; margin-bottom:5px;">Documento (CPF):</label>
                        <input type="text" id="documentoPaciente" placeholder="Apenas números" style="width: 100%;">
                    </div>
                    <div>
                        <label for="sexoPaciente" style="display:block; margin-bottom:5px;">Sexo:</label>
                        <select id="sexoPaciente" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                            <option value="">Selecione...</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                        </select>
                    </div>
                    <div>
                        <label for="nascimentoPaciente" style="display:block; margin-bottom:5px;">Nascimento:</label>
                        <input type="date" id="nascimentoPaciente" style="width: 100%;">
                    </div>
                    <div>
                        <label for="idadePaciente" style="display:block; margin-bottom:5px;">Idade:</label>
                        <input type="text" id="idadePaciente" readonly placeholder="Calculada" style="width: 100%; background: #f1f5f9; cursor: not-allowed; color: #64748b;">
                    </div>
                </div>

                <div class="label-com-botao">
                    <label for="historicoInput">Dados Clínicos (Comorbidades, Medicamentos):</label>
                    <div class="historico-tools">
                        <input type="file" id="historicoPdfInput" accept="application/pdf" class="hidden">
                        <button class="btn-secondary" id="btnExtrairHistorico" type="button">📄 Extrair de PDF</button>
                        <span id="historicoLoading" class="hidden loading-text">A extrair dados...</span>
                    </div>
                </div>
                <textarea id="historicoInput" class="small-text" placeholder="Ex: Hipertenso, faz uso de Losartana..."></textarea>

                <label for="anamnesePaciente">Anamnese / Queixa Principal:</label>
                <textarea id="anamnesePaciente" placeholder="Ex: Paciente relata dor torácica..."></textarea>
                
                <!-- Sistema de Abas para Exames Complementares -->
                <label>Exames Complementares (Opcional):</label>
                <div class="tabs">
                    <button class="tab-btn active" data-target="tab-texto" type="button">Digitar Resultados</button>
                    <button class="tab-btn" data-target="tab-pdf" type="button">Anexar Laudo (PDF)</button>
                </div>

                <div id="tab-texto" class="tab-content active">
                    <textarea id="laudoInput" class="small-text" placeholder="Cole aqui os resultados relevantes (ex: Troponina, ECG...)"></textarea>
                </div>

                <div id="tab-pdf" class="tab-content">
                    <label for="pdfInput" class="file-upload-wrapper" style="display: block; cursor: pointer;">
                        <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
                        <p class="file-hint">📄 Clique aqui para anexar o PDF do laudo laboratorial ou de imagem.</p>
                    </label>
                </div>
            </div>

            <div class="action-buttons-wrapper">
                <button id="btnSalvarAnamnese" class="action-btn btn-outline" type="button">Salvar Apenas Anamnese</button>
                <button id="btnAnalisar" class="action-btn" type="button">Analisar com IA e Salvar</button>
            </div>
            
            <!-- SINAL DE LOADING ANIMADO DA IA (Controlado pelo JS) -->
            <div id="loading" class="hidden loading-container">
                <div class="spinner"></div>
                <p class="loading-text" style="color: #64748b; font-weight: 500;">A analisar quadro clínico com Inteligência Artificial...</p>
            </div>
            
            <div id="resultadoBox" class="hidden">
                <h2>Avaliação da IA:</h2>
                <div id="resultadoTexto"></div>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div style="grid-column: span 2;">
                    <label>E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled style="background: #f1f5f9; cursor: not-allowed; width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva" style="width: 100%;">
                </div>
                
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento" style="width: 100%;">
                </div>
                
                <div>
                    <label>CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00" style="width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP" style="width: 100%;">
                    <small style="color: gray; font-size: 12px; margin-top: 4px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="consulta.js"></script>
</body>
</html>
