<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pacientes - CDSS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text"><strong>CDSS</strong></span>
        </div>
        
        <nav class="header-nav">
            <a href="fila.html" class="nav-item">Fila de Espera</a>
            <a href="consulta.html" class="nav-item">Nova Consulta</a>
            <a href="pacientes.html" class="nav-item active">Meus Pacientes</a>
        </nav>

        <div class="header-user">
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">CRM: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">👨‍⚕️</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <!-- LISTA -->
            <div id="listaPacientesContainer">
                <div class="section-header">
                    <h2>Meus Pacientes</h2>
                    <a href="consulta.html" class="btn-success" style="text-decoration: none;">+ Nova Consulta</a>
                </div>
                <div class="table-container">
                    <table class="saas-table">
                        <thead>
                            <tr>
                                <th>Nome do Paciente</th>
                                <th>Idade</th>
                                <th>CPF / Documento</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaPacientesCrud"></tbody>
                    </table>
                </div>
            </div>

            <!-- TIMELINE (Oculta por padrão) -->
            <div id="detalhesPacienteContainer" class="hidden">
                <div class="section-header" style="flex-direction: column; align-items: flex-start; gap: 15px;">
                    <button id="btnVoltarPacientes" class="btn-secondary">← Voltar para Lista</button>
                    <h2 id="tituloNomePaciente" style="color: var(--primary); font-size: 24px;">Prontuário</h2>
                </div>
                <div id="timelineProntuario" class="timeline-wrapper"></div>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div class="form-grid-2" style="margin-bottom: 20px;">
                <div class="col-span-2">
                    <label for="perfilEmail">E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled>
                </div>
                
                <div class="col-span-2">
                    <label for="perfilNome">Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva">
                </div>
                
                <div>
                    <label for="perfilNascimento">Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento">
                </div>
                
                <div>
                    <label for="perfilCpf">CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00">
                </div>
                
                <div class="col-span-2">
                    <label for="perfilCrmPessoal">CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP">
                    <small style="color: var(--text-muted); font-size: 12px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="pacientes.js"></script>
</body>
</html>
