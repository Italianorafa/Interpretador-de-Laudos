<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila de Espera - CDSS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="saas-header">
        <div class="header-logo">
            <span class="logo-icon">⚕️</span><span class="logo-text"><strong>CDSS</strong></span>
        </div>
        
        <nav class="header-nav">
            <a href="fila.html" class="nav-item active" style="text-decoration: none;">Fila de Espera</a>
            <a href="consulta.html" class="nav-item" style="text-decoration: none;">Nova Consulta</a>
            <a href="pacientes.html" class="nav-item" style="text-decoration: none;">Meus Pacientes</a>
        </nav>

        <div class="header-user">
            <a href="configuracoes.html" class="settings-icon" title="Configurações e Acessos">⚙️</a>
            <div class="user-info">
                <span id="medicoLogadoName" class="user-name">Carregando...</span>
                <span class="user-crm">CRM: <span id="medicoLogadoCrm">---</span></span>
            </div>
            <button id="btnPerfil" class="user-avatar" title="Editar Perfil">👨‍⚕️</button>
            <button id="btnSair" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="section-header">
                <h2>Pacientes Aguardando Atendimento</h2>
                <button class="action-btn" onclick="carregarFila()" style="background: white; color: var(--text); border: 1px solid var(--border);">🔄 Atualizar Fila</button>
            </div>

            <!-- Aqui os cartões dos pacientes serão injetados pelo JavaScript -->
            <div id="gridFilaEspera" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
                <!-- Exemplo de como o card ficará (Injetado via JS) -->
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Dados Pessoais -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header">
                <h3>Meus Dados Pessoais</h3>
                <button id="btnFecharPerfil" class="close-modal">✖</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div style="grid-column: span 2;">
                    <label>E-mail de Acesso:</label>
                    <input type="text" id="perfilEmail" disabled style="background: #f1f5f9; cursor: not-allowed; width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>Nome Completo:</label>
                    <input type="text" id="perfilNome" placeholder="Ex: Dr. João da Silva" style="width: 100%;">
                </div>
                
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" id="perfilNascimento" style="width: 100%;">
                </div>
                
                <div>
                    <label>CPF:</label>
                    <input type="text" id="perfilCpf" placeholder="000.000.000-00" style="width: 100%;">
                </div>
                
                <div style="grid-column: span 2;">
                    <label>CRM Pessoal (Apenas para Médicos):</label>
                    <input type="text" id="perfilCrmPessoal" placeholder="Ex: 123456-SP" style="width: 100%;">
                    <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">Se você é da equipa de recepção ou triagem, deixe este campo em branco.</small>
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="btnSalvarPerfil" class="action-btn">Salvar Dados</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="fila.js"></script>
</body>
</html>
